{
  "openapi": "3.1.0",
  "info": {
    "title": "LaMarge API",
    "version": "1.0.0",
    "description": "Makers publish short-lived quotes; takers reserve and pay cross-venue fills. The operator is trusted across chains ([trust model](/how-it-works#trust-model)). Routes are under `/v1` except `/health` and `/share` ([conventions](/api-reference/overview#conventions))."
  },
  "servers": [
    {
      "url": "http://localhost:8080",
      "description": "API for this documentation environment."
    }
  ],
  "tags": [
    {
      "name": "Market data"
    },
    {
      "name": "Link previews"
    },
    {
      "name": "Authentication"
    },
    {
      "name": "Credentials"
    },
    {
      "name": "Account"
    },
    {
      "name": "Orders"
    },
    {
      "name": "Quotes"
    },
    {
      "name": "Closes"
    },
    {
      "name": "Escrow"
    },
    {
      "name": "Transfers"
    },
    {
      "name": "Takes and fills"
    },
    {
      "name": "Withdrawals"
    },
    {
      "name": "Events and recovery"
    },
    {
      "name": "Admin"
    }
  ],
  "security": [],
  "paths": {
    "/share/v1/{filename}": {
      "get": {
        "tags": [
          "Link previews"
        ],
        "summary": "Get a site sharing image",
        "operationId": "getSiteShareImage",
        "description": "Public 1200 by 630 PNG; both filenames return the same image. Cacheable for one hour.",
        "parameters": [
          {
            "name": "filename",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "enum": [
                "landing.png",
                "app.png"
              ]
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Social card image.",
            "content": {
              "image/png": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "404": {
            "description": "Unknown image.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        }
      }
    },
    "/share/v1/trades/{id}/image.png": {
      "get": {
        "tags": [
          "Link previews"
        ],
        "summary": "Get a transfer sharing image",
        "operationId": "getTradeShareImage",
        "description": "Public 1200 by 630 PNG of a published trade: venues, settlement time and amounts rounded to four decimals. Cacheable for one hour.",
        "parameters": [
          {
            "$ref": "#/components/parameters/Id"
          }
        ],
        "responses": {
          "200": {
            "description": "Public transfer receipt image.",
            "content": {
              "image/png": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          },
          "404": {
            "description": "Unknown or unpublished trade.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        }
      }
    },
    "/share/trade": {
      "get": {
        "tags": [
          "Link previews"
        ],
        "summary": "Get explorer sharing metadata",
        "operationId": "getTradeShareMetadata",
        "description": "HTML head tags for a trade's explorer page, absolute URLs on the primary app origin; generic tags for a missing, invalid or unpublished trade or a lookup over two seconds. Not cached.",
        "parameters": [
          {
            "name": "trade",
            "in": "query",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Escaped title, description, canonical URL, Open Graph and card tags.",
            "content": {
              "text/html": {
                "schema": {
                  "type": "string"
                }
              }
            }
          }
        }
      }
    },
    "/v1/venues": {
      "get": {
        "tags": [
          "Market data"
        ],
        "summary": "List venues",
        "description": "Every venue in display order, with its settlement terms, token, permit domain, margin-transfer format and deposit minimum, all null when disabled. Check them against the [deployment values](/how-it-works#deployment-values) before signing.",
        "operationId": "getVenues",
        "responses": {
          "200": {
            "description": "Every venue, enabled or not.",
            "content": {
              "application/json": {
                "schema": {
                  "type": "array",
                  "items": {
                    "$ref": "#/components/schemas/Venue"
                  }
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        }
      }
    },
    "/v1/venues/aster/rpc": {
      "post": {
        "tags": [
          "Market data"
        ],
        "summary": "Aster signing network",
        "description": "RPC URL of chain 1666 (`0x682`), which a wallet adds with `wallet_addEthereumChain` to sign an Aster transfer: wallets sign typed data only for their current chain. It answers only `eth_chainId` and `net_version`; other methods get JSON-RPC error -32601.",
        "operationId": "postAsterSigningRpc",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {}
            }
          }
        },
        "responses": {
          "200": {
            "description": "The JSON-RPC answer, or answers for a batch.",
            "content": {
              "application/json": {
                "schema": {}
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "415": {
            "description": "Body not sent as `Content-Type: application/json`.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/v1/books": {
      "get": {
        "tags": [
          "Market data"
        ],
        "summary": "Get a book",
        "description": "Levels the taker pays on `from` and receives on `to`, best price first, then oldest; they are not reservations. A level is a quote that [admits takes](/how-it-works#quotes), with a signed expiry at least the maker timeout away and `min(available, max_fill)` at least `min_fill`. With a Hyperliquid `from`, or a pool held inside Lighter or Aster (approved makers only), the maker's balance must have been read within two minutes. Over 8000 candidate levels: 503 `SNAPSHOT_TOO_LARGE`.",
        "operationId": "getBook",
        "parameters": [
          {
            "name": "from",
            "in": "query",
            "required": true,
            "description": "The venue the taker pays on.",
            "schema": {
              "$ref": "#/components/schemas/VenueId"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": true,
            "description": "The venue the taker receives on.",
            "schema": {
              "$ref": "#/components/schemas/VenueId"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "The book.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Book"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          },
          "422": {
            "$ref": "#/components/responses/VenueDisabled"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          },
          "503": {
            "$ref": "#/components/responses/SnapshotTooLarge"
          }
        }
      }
    },
    "/v1/routes": {
      "get": {
        "tags": [
          "Market data"
        ],
        "summary": "Get the best route",
        "description": "What takes would pay now on `to` for `amount_in` on `from`: one take, or two through another venue when no direct take is possible (Lighter and Aster) or finds nothing, or when two pay at least 10 bps more and spend no less. The second take pays what the first delivers, less the Lighter account's transfer fee, rounded down to millionths; where it carries less, the first shrinks to fit. With `min_out`, a route delivering under that price for its amount shrinks to the largest amount that meets it, rather than none. `capped`: the route spends less than `amount_in` beyond rounding; `amount_in` can be short of the request by less than a base unit of output per part without it. Takes are admitted as `POST /v1/takes` admits them, your own orders excluded; no route goes through Lighter without a linked account and a known fee. The error is what refuses the direct take, or every route; an unusable venue between only drops its routes. Nothing is reserved.",
        "operationId": "getRoute",
        "security": [
          {
            "session": []
          }
        ],
        "parameters": [
          {
            "name": "from",
            "in": "query",
            "required": true,
            "description": "The venue the taker pays on.",
            "schema": {
              "$ref": "#/components/schemas/VenueId"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": true,
            "description": "The venue the taker receives on.",
            "schema": {
              "$ref": "#/components/schemas/VenueId"
            }
          },
          {
            "name": "amount_in",
            "in": "query",
            "required": true,
            "description": "Most the taker pays, in `from` base units.",
            "schema": {
              "$ref": "#/components/schemas/Amount"
            }
          },
          {
            "name": "min_out",
            "in": "query",
            "required": false,
            "description": "Least the taker receives for `amount_in`, in `to` base units: the worst price it takes. A smaller amount is held to the same price, in proportion.",
            "schema": {
              "$ref": "#/components/schemas/Amount"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "The route.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Route"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "description": "`FORBIDDEN`: paying from a venue is suspended after failed payments.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "`INSUFFICIENT_LIQUIDITY`: no route takes this amount.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "422": {
            "$ref": "#/components/responses/VenueDisabled"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          },
          "503": {
            "description": "`OPERATOR_UNAVAILABLE`, retryable: settlement is not ready for new commitments; or `SNAPSHOT_TOO_LARGE`.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    },
    "/v1/trades/{id}/proof": {
      "get": {
        "tags": [
          "Market data"
        ],
        "summary": "Get signed trade proof",
        "operationId": "getTradeProof",
        "description": "The settled trade's signed maker `QuoteSet`, funding authorization (`FundOffer`, or the delivery for a pool held inside a venue) and taker `PayTake` (or the executed `payment` when paid from Lighter or Aster), with digests and relayed transactions. Public once all three are recorded.",
        "parameters": [
          {
            "$ref": "#/components/parameters/Id"
          }
        ],
        "responses": {
          "200": {
            "description": "Signed maker and taker agreements.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/TradeProof"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          },
          "404": {
            "description": "`NOT_FOUND`: unknown, unsettled or unpublished trade.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        }
      }
    },
    "/v1/volume": {
      "get": {
        "tags": [
          "Market data"
        ],
        "summary": "Get 24h volume",
        "description": "Public trades between `a` and `b`, either way, settled in the last 24 hours, in `b` base units.",
        "operationId": "getVolume",
        "parameters": [
          {
            "$ref": "#/components/parameters/PairA"
          },
          {
            "$ref": "#/components/parameters/PairB"
          }
        ],
        "responses": {
          "200": {
            "description": "The pair's 24-hour volume.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Volume"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          },
          "422": {
            "$ref": "#/components/responses/VenueDisabled"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        }
      }
    },
    "/v1/markets": {
      "get": {
        "tags": [
          "Market data"
        ],
        "summary": "Get venue prices",
        "description": "Per enabled venue: the best price lines of the quote identities whose quotes the books show (`best_buy` the highest price a maker pays to receive the venue's token there, `best_sell` the lowest it asks to deliver it there, in USDC), the liquidity those books draw from each pool once, and the volume delivered there in the last 24 hours. Prices are indicative: the best buy and the best sell may come from different makers, and a route always prices one maker's pair ([quote lines](/how-it-works#quote-lines)). Pools quoted without lines count in `liquidity` only. An answer is reused for two seconds. Over 1000 eligible orders: 503 `SNAPSHOT_TOO_LARGE`.",
        "operationId": "getMarkets",
        "responses": {
          "200": {
            "description": "The venues in registry order.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Markets"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          },
          "503": {
            "$ref": "#/components/responses/SnapshotTooLarge"
          }
        }
      }
    },
    "/health": {
      "get": {
        "tags": [
          "Market data"
        ],
        "summary": "Health",
        "description": "Settlement readiness; 503 with the same body when a chain other than an exit-only escrow is not `ready`.",
        "operationId": "getHealth",
        "responses": {
          "200": {
            "description": "Every chain but exit-only escrows is ready.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          },
          "503": {
            "description": "Not ready for new settlement commitments.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          }
        }
      }
    },
    "/v1/info": {
      "get": {
        "tags": [
          "Market data"
        ],
        "summary": "Get deployment info",
        "operationId": "getV1Info",
        "description": "API version, limits, settlement timings, operator, deployments and access mode. Not a signing trust root: compare with independently reviewed configuration.",
        "responses": {
          "200": {
            "description": "The deployment.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Info"
                }
              }
            }
          }
        }
      }
    },
    "/v1/auth/challenge": {
      "post": {
        "tags": [
          "Authentication"
        ],
        "summary": "Request a sign-in message",
        "description": "A one-use EIP-4361 message for the master address, valid ten minutes, on the request's `Origin` if allowed, else the main app origin. Check domain, URI, address and expiry before `personal_sign`.",
        "operationId": "postAuthChallenge",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "address"
                ],
                "properties": {
                  "address": {
                    "$ref": "#/components/schemas/Address",
                    "description": "The master address."
                  }
                },
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The message to sign.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Challenge"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        }
      }
    },
    "/v1/auth/verify": {
      "post": {
        "tags": [
          "Authentication"
        ],
        "summary": "Verify a signed message",
        "description": "Consumes the challenge and returns a revocable master session; a failed attempt leaves the challenge usable. The first sign-in creates the user; beyond 32 active sessions, the oldest are revoked.",
        "operationId": "postAuthVerify",
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "address",
                  "nonce",
                  "signature"
                ],
                "properties": {
                  "address": {
                    "$ref": "#/components/schemas/Address"
                  },
                  "nonce": {
                    "type": "string"
                  },
                  "signature": {
                    "$ref": "#/components/schemas/Signature"
                  }
                },
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The session.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Session"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadSignature"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        }
      }
    },
    "/v1/auth/sessions/{id}": {
      "delete": {
        "tags": [
          "Authentication"
        ],
        "summary": "Revoke a master session",
        "operationId": "deleteV1AuthSessionsId",
        "description": "Revokes one of the user's sessions, the current one included; a repeat answers 204. Credentials are unaffected.",
        "security": [
          {
            "session": []
          }
        ],
        "parameters": [
          {
            "$ref": "#/components/parameters/Id"
          }
        ],
        "responses": {
          "204": {
            "description": "Revoked."
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        }
      }
    },
    "/v1/me": {
      "get": {
        "tags": [
          "Account"
        ],
        "summary": "Get my account",
        "description": "The master address, its linked venue accounts and its access.",
        "operationId": "getMe",
        "security": [
          {
            "session": []
          }
        ],
        "responses": {
          "200": {
            "description": "The user.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Me"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        }
      }
    },
    "/v1/accounts/link/challenge": {
      "post": {
        "tags": [
          "Account"
        ],
        "summary": "Request a link message",
        "description": "The EIP-191 message `address` signs to prove it controls the venue account: single use, valid ten minutes, not needed for the master address.",
        "operationId": "postLinkChallenge",
        "security": [
          {
            "session": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "type": "object",
                "required": [
                  "venue",
                  "address"
                ],
                "properties": {
                  "venue": {
                    "$ref": "#/components/schemas/VenueId"
                  },
                  "address": {
                    "$ref": "#/components/schemas/Address",
                    "description": "Owner of the venue account; signs its transfers."
                  }
                },
                "additionalProperties": false
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "The message to sign.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Challenge"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/AccessRequired"
          },
          "413": {
            "$ref": "#/components/responses/PayloadTooLarge"
          },
          "422": {
            "$ref": "#/components/responses/VenueDisabled"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "500": {
            "$ref": "#/components/responses/Internal"
          }
        }
      }
    },
    "/v1/accounts/{venue}/setup": {
      "parameters": [
        {
          "name": "venue",
          "in": "path",
          "required": true,
          "schema": {
            "$ref": "#/components/schemas/VenueId"
          }
        }
      ],
      "get": {
        "tags": [
          "Account"
        ],
        "operationId": "getVenueSetup",
        "summary": "Read account setup",
        "description": "The linked account's setup steps, each read from the venue now: a step the venue shows is recorded `done`, one it no longer accepts is `required` again with its `reason`. A permit prepared but not signed carries its `to_sign`. `ready` once every step is done ([setup](/quickstart#set-up-venue-accounts)).",
        "security": [
          {
            "session": []
          }
        ],
        "responses": {
          "200": {
            "description": "The steps.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/VenueSetup"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/ValidationError"
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/AccessRequired"
          },
          "422": {
            "$ref": "#/components/responses/AccountNotLinked"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
