    "/v1/stream": {
      "get": {
        "tags": [
          "Events and recovery"
        ],
        "summary": "WebSocket event replay",
        "operationId": "getV1Stream",
        "description": "First text frame, within five seconds: a `StreamSubscription`, else the socket closes; never put `token` in the URL ([WebSocket](/streaming#websocket)). Private streams need a session or `read` credential, rechecked about every 500 ms. Frames are `EventPage`s of up to 100 events, empty about every 500 ms when idle. A `StreamControl` precedes closure on authorization, capacity, resync or journal failure. Any later client message other than ping or pong, or a send blocked five seconds, closes the socket.",
        "responses": {
          "101": {
            "description": "Upgraded to WebSocket."
          },
          "400": {
            "description": "Not a WebSocket upgrade request.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "`RATE_LIMITED`: connection limit reached.",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        },
        "x-websocket": {
          "clientMessage": {
            "$ref": "#/components/schemas/StreamSubscription"
          },
          "serverMessage": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/EventPage"
              },
              {
                "$ref": "#/components/schemas/StreamControl"
              }
            ]
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "session": {
        "type": "http",
        "scheme": "bearer",
        "description": "From `POST /v1/auth/verify`; seven days by default, revocable. Required for financial operations. 60 requests/s, burst 120, shared by the user's sessions."
      },
      "makerCredential": {
        "type": "http",
        "scheme": "bearer",
        "description": "`mk_` bearer, returned once at creation or rotation, limited to its quote identity and each route's stated scope; new quote commitments also need the owner's access, delivery reports do not. Never moves capital. 60 requests/s, burst 120, per credential."
      },
      "partnerKey": {
        "type": "apiKey",
        "in": "header",
        "name": "x-lamarge-partner-key",
        "description": "A partner service's key, configured only as its SHA-256 in `PARTNER_KEYS`. 5 requests/s, burst 60, per partner."
      }
    },
    "parameters": {
      "OrderId": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/Bytes32"
        }
      },
      "PairA": {
        "name": "a",
        "in": "query",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/VenueId"
        }
      },
      "PairB": {
        "name": "b",
        "in": "query",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/VenueId"
        }
      },
      "Id": {
        "name": "id",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/Uuid"
        }
      },
      "HistoryAfter": {
        "name": "after",
        "in": "query",
        "schema": {
          "type": "string",
          "maxLength": 512
        },
        "description": "`next_cursor` from the same route and filters; omit for the newest page."
      },
      "Limit": {
        "name": "limit",
        "in": "query",
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 500,
          "default": 100
        }
      },
      "ReplayAfter": {
        "name": "after",
        "in": "query",
        "schema": {
          "$ref": "#/components/schemas/Cursor"
        },
        "description": "Replay strictly after this cursor; 0 when omitted."
      }
    },
    "schemas": {
      "VenueId": {
        "type": "string",
        "description": "A venue id from `GET /v1/venues`."
      },
      "Amount": {
        "type": "string",
        "pattern": "^[0-9]{1,78}$",
        "description": "Decimal base units of the venue's token (`decimals` in `GET /v1/venues`), below 2^256: with 6 decimals, `\"1000000\"` is 1 token."
      },
      "Address": {
        "type": "string",
        "pattern": "^0x[0-9a-fA-F]{40}$",
        "description": "Any case accepted; responses are lowercase except inside typed data and signed messages."
      },
      "Bytes32": {
        "type": "string",
        "pattern": "^0x[0-9a-fA-F]{64}$"
      },
      "Signature": {
        "type": "string",
        "pattern": "^0x[0-9a-fA-F]{130}$",
        "description": "A 65-byte signature `r ‖ s ‖ v`, `v` 0, 1, 27 or 28, `s` low (EIP-2)."
      },
      "QuoteSignature": {
        "type": "string",
        "pattern": "^0x([0-9a-fA-F]{2})*$",
        "maxLength": 32770,
        "description": "An EOA signature; for `quote_set` only, also an opaque ERC-1271 signature (up to 16384 bytes) from a quote delegate deployed on the supply chain."
      },
      "Timestamp": {
        "type": "string",
        "format": "date-time",
        "description": "RFC 3339 UTC (`Z` or `+00:00`), fractional seconds optional."
      },
      "Error": {
        "type": "object",
        "required": [
          "error"
        ],
        "properties": {
          "error": {
            "type": "object",
            "required": [
              "code",
              "message",
              "request_id",
              "retryable"
            ],
            "properties": {
              "code": {
                "type": "string",
                "description": "Stable; see [errors](/api-reference/overview#errors)."
              },
              "message": {
                "type": "string",
                "description": "Human-readable; do not parse."
              },
              "reason": {
                "type": "string",
                "description": "Stable sub-case of `code`, where the route lists its values."
              },
              "venue": {
                "$ref": "#/components/schemas/VenueId",
                "description": "`SETUP_REQUIRED`: the venue whose account needs setup."
              },
              "step": {
                "type": "string",
                "enum": [
                  "permit",
                  "agent",
                  "api_key"
                ],
                "description": "`SETUP_REQUIRED`: the step to do, by [setup](/api-reference/account/setup)."
              },
              "request_id": {
                "$ref": "#/components/schemas/Uuid"
              },
              "retryable": {
                "type": "boolean",
                "description": "True for 425, 429, 503 and 502 except `VENUE_REJECTED`. Retry with the same client id, draft or signed operation; an uncertain withdrawal may have succeeded."
              }
            }
          }
        }
      },
      "Venue": {
        "type": "object",
        "required": [
          "id",
          "name",
          "enabled",
          "settlement",
          "chain",
          "margin_move",
          "release_minimum"
        ],
        "properties": {
          "id": {
            "$ref": "#/components/schemas/VenueId"
          },
          "name": {
            "type": "string"
          },
          "enabled": {
            "type": "boolean",
            "description": "Enabled and configured in this deployment."
          },
          "settlement": {
            "type": [
              "string",
              "null"
            ],
            "enum": [
              "escrow",
              "venue",
              null
            ],
            "description": "`escrow`: the maker's side of each fill locks in the escrow on `chain`. `venue` (Lighter, Aster): the maker delivers inside the venue ([active market making](/market-making#active-market-making)); `chain` only names signing terms. Null for a disabled venue."
          },
          "chain": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/EscrowChain"
              },
              {
                "type": "null"
              }
            ],
            "description": "Null for a disabled venue."
          },
          "margin_move": {
            "oneOf": [
              {
                "$ref": "#/components/schemas/MarginMoveSpec"
              },
              {
                "type": "null"
              }
            ],
            "description": "Margin-transfer format; null when disabled or without margin transfers (Lighter)."
          },
          "release_minimum": {
            "type": [
              "string",
              "null"
            ],
            "description": "Smallest amount the venue credits (deposit contract, or Lighter's 1 USDC transfer); a smaller escrow release stays in escrow. Null when none."
          }
        }
      },
      "EscrowChain": {
        "type": "object",
        "required": [
          "id",
          "escrow",
          "token",
          "symbol",
          "decimals",
          "permit"
        ],
        "properties": {
          "id": {
            "type": "integer",
            "description": "999 HyperEVM, 137 Polygon; on a venue settled inside itself its signing chain id, 304 for Lighter (`escrow` its zkLighter contract, `token` Ethereum's USDC), 56 for Aster (`escrow` its vault, `token` BSC's USDT)."
          },
          "escrow": {
            "$ref": "#/components/schemas/Address"
          },
          "token": {
            "$ref": "#/components/schemas/Address"
          },
          "symbol": {
            "type": "string"
          },
          "decimals": {
            "type": "integer"
          },
          "permit": {
            "description": "EIP-2612 domain name and version; the chain id and token complete it. Null on a venue settled inside itself.",
            "oneOf": [
              {
                "type": "object",
                "required": [
                  "name",
                  "version"
                ],
                "properties": {
                  "name": {
                    "type": "string"
                  },
                  "version": {
                    "type": "string"
                  }
                }
              },
              {
                "type": "null"
              }
            ]
          }
        }
      },
      "MarginMoveSpec": {
        "type": "object",
        "required": [
          "primary_type",
          "types",
          "domain",
          "fixed",
          "amount",
          "destinations"
        ],
        "properties": {
          "primary_type": {
            "type": "string",
            "description": "`primaryType` of a `margin_move` item."
          },
          "types": {
            "$ref": "#/components/schemas/Eip712Types"
          },
          "domain": {
            "$ref": "#/components/schemas/Eip712Domain"
          },
          "fixed": {
            "type": "object",
            "additionalProperties": true,
            "description": "Fields every transfer signs with these values; addresses compare case-insensitively. Fields that vary: amount, nonce or salt and time; Hyperliquid `sourceDex`; Polymarket `account` (your signer) and `to` (`venue_wallet`, signer or deposit address per destination); Aster `destination` (your signer) and `fee`."
          },
          "amount": {
            "type": "string",
            "enum": [
              "base_units",
              "decimal"
            ],
            "description": "Signed amount format: integer base units, or decimal tokens such as `\"5.25\"`."
          },
          "destinations": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "wallet",
                "signer",
                "escrow"
              ]
            },
            "description": "`to` values `POST /v1/withdrawals/prepare` accepts on this venue."
          }
        }
      },
      "Book": {
        "type": "object",
        "required": [
          "from",
          "to",
          "max_fill",
          "levels"
        ],
        "properties": {
          "from": {
            "$ref": "#/components/schemas/VenueId"
          },
          "to": {
            "$ref": "#/components/schemas/VenueId"
          },
          "max_fill": {
            "$ref": "#/components/schemas/Amount",
            "description": "Most one fill takes from one level, in `to` base units."
          },
          "levels": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/Level"
            }
          }
        }
      },
      "Route": {
        "type": "object",
        "required": [
          "from",
          "to",
          "amount_in",
          "amount_out",
          "capped",
          "legs"
        ],
        "properties": {
          "from": {
            "$ref": "#/components/schemas/VenueId"
          },
          "to": {
            "$ref": "#/components/schemas/VenueId"
          },
          "amount_in": {
            "$ref": "#/components/schemas/Amount",
            "description": "What the first take pays, in `from` base units."
          },
          "capped": {
            "type": "boolean",
            "description": "True when the route spends less than the request beyond rounding: what it leaves buys a base unit of output or more per part."
          },
          "amount_out": {
            "$ref": "#/components/schemas/Amount",
            "description": "What the last take delivers, in `to` base units."
          },
          "legs": {
            "type": "array",
            "minItems": 1,
            "maxItems": 2,
            "description": "The takes in order. Of two, the first delivers on the venue between, from where the second pays; its `amount_in` is less than the first's `amount_out` by what that venue keeps.",
            "items": {
              "type": "object",
              "required": [
                "from",
                "to",
                "amount_in",
                "amount_out",
                "parts"
              ],
              "properties": {
                "from": {
                  "$ref": "#/components/schemas/VenueId"
                },
                "to": {
                  "$ref": "#/components/schemas/VenueId"
                },
                "amount_in": {
                  "$ref": "#/components/schemas/Amount"
                },
                "amount_out": {
                  "$ref": "#/components/schemas/Amount"
                },
                "parts": {
                  "type": "integer",
                  "minimum": 1,
                  "maximum": 8,
                  "description": "Price levels the take goes through."
                }
              },
              "additionalProperties": false
            }
          }
        },
        "additionalProperties": false
      },
      "Level": {
        "type": "object",
        "description": "One quote of an order: the taker pays `receive` on `from` per `supply` on `to`. An order may have several levels per book.",
        "required": [
          "order_id",
          "quote_index",
          "supply",
          "receive",
          "available",
          "min_fill",
          "expires_at",
