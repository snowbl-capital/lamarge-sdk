# A tag sdk-vX.Y.Z publishes that version to npm through trusted publishing: no token is stored,
# and npm records the provenance of the tarball (this repository, this workflow, this commit).
name: Release
on:
  push:
    tags: ['sdk-v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.12
          registry-url: https://registry.npmjs.org
      - name: The tag names the package's version
        run: |
          test "sdk-v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun install --frozen-lockfile
      - run: bun run check
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install --global npm@11.6.2
      # A prerelease goes to the `next` tag, never to `latest`.
      - run: |
          tag=$(node -p 'require("./package.json").version.includes("-") ? "next" : "latest"')
          npm publish --provenance --access public --tag "$tag"
